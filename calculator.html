<!DOCTYPE html>
<html lang="ja">
    <!-- ここからはじまり -->
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>プログラミング練習</title>
</head>

<body>

    <p>簡易電卓</p>
    <p><span id="formula"></span></p>
    <p>
        <button class="num">1</button>
        <button class="num">2</button>
        <button class="num">3</button>
        <button id="clear">C</button>
    </p>
    <p>
        <button class="num">4</button>
        <button class="num">5</button>
        <button class="num">6</button>
    </p>
    <p>
        <button class="num">7</button>
        <button class="num">8</button>
        <button class="num">9</button>
        <button class="num">0</button>
    </p>

    <p>
        <button class="arithmetic" data-type="add">+</button>
        <button class="arithmetic" data-type="subtract">-</button>
        <button class="arithmetic" data-type="multiply">×</button>
        <button class="arithmetic" data-type="divide">÷</button>
        <button class="arithmetic" data-type="equals">=</button>
    </p>

    <p><span id="result">計算結果</span></p>
    
    <p><a href="index.html">ホームページ</a></p>
    
    <script src="calculator.js"></script>

</body>
    <!-- ここで終わり -->
</html>
